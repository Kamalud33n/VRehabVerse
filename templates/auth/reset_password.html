<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — MedNova VR Rehab</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
    <link rel="stylesheet" href="/static/css/landing.css?v=1">
    <link rel="stylesheet" href="/static/css/auth-pages.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-shell-brand">
            <div class="auth-brand-logo">
                <img src="/assets/logo.png?v=2" alt="logo">
                <span>MedNova VR Rehab</span>
            </div>
            <h1 class="auth-brand-headline">Set a new password</h1>
            <p class="auth-brand-sub">Choose a strong password — at least 8 characters.</p>
        </div>

        <div class="auth-shell-form">
            <div class="auth-card">
                <div class="auth-card-header">
                    <h1>Reset password</h1>
                    <p>Enter and confirm your new password.</p>
                </div>

                <div class="auth-alert error" id="rpError"></div>
                <div class="auth-alert success" id="rpSuccess"></div>

                <form id="rpForm">
                    <div class="form-group">
                        <label>New password</label>
                        <input class="form-input" type="password" id="newPassword" required minlength="8" placeholder="Min. 8 characters">
                    </div>
                    <div class="form-group">
                        <label>Confirm new password</label>
                        <input class="form-input" type="password" id="confirmPassword" required minlength="8" placeholder="Re-enter password">
                    </div>
                    <button type="submit" class="auth-submit-btn" id="rpBtn">Update password</button>
                </form>

                <div class="auth-card-footer">
                    <a href="/login">Back to login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('rpForm');
        const errorBox = document.getElementById('rpError');
        const successBox = document.getElementById('rpSuccess');
        const btn = document.getElementById('rpBtn');

        if (!token) {
            errorBox.textContent = 'This reset link is missing its token. Request a new one from the Forgot Password page.';
            errorBox.style.display = 'block';
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword !== confirmPassword) {
                errorBox.textContent = 'Passwords do not match';
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Reset failed');

                successBox.textContent = data.message;
                successBox.style.display = 'block';
                form.style.display = 'none';
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Update password';
            }
        });
    </script>
</body>
</html>
