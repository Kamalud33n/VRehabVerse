<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — MedNova VR Rehab</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
    <link rel="stylesheet" href="/static/css/landing.css?v=1">
    <link rel="stylesheet" href="/static/css/auth-pages.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-shell-brand">
            <div class="auth-brand-logo">
                <img src="/assets/logo.png?v=2" alt="logo">
                <span>MedNova VR Rehab</span>
            </div>
            <h1 class="auth-brand-headline">Forgot your password?</h1>
            <p class="auth-brand-sub">No problem — enter the email tied to your account and we'll generate a reset link for you.</p>
        </div>

        <div class="auth-shell-form">
            <div class="auth-card">
                <div class="auth-card-header">
                    <h1>Reset password</h1>
                    <p>Enter your account email below.</p>
                </div>

                <div class="auth-alert error" id="fpError"></div>
                <div class="auth-alert success" id="fpSuccess"></div>

                <form id="fpForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input class="form-input" type="email" id="email" required placeholder="you@hospital.com">
                    </div>
                    <button type="submit" class="auth-submit-btn" id="fpBtn">Send reset link</button>
                </form>

                <div class="auth-card-footer">
                    Remembered it? <a href="/login">Back to login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('fpForm');
        const errorBox = document.getElementById('fpError');
        const successBox = document.getElementById('fpSuccess');
        const btn = document.getElementById('fpBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Something went wrong');

                let msg = data.message;
                // Dev-mode convenience: no email provider wired up yet, so
                // show the token/link directly instead of it going nowhere.
                if (data.dev_reset_token) {
                    const link = `${window.location.origin}/reset-password?token=${data.dev_reset_token}`;
                    msg += ` (Dev mode — no email service configured: <a href="${link}">${link}</a>)`;
                }
                successBox.innerHTML = msg;
                successBox.style.display = 'block';
                form.reset();
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send reset link';
            }
        });
    </script>
</body>
</html>
