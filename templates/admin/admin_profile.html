<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — MedNova VR Rehab Admin</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/auth-pages.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img class="logo-icon" src="/assets/logo.png?v=2" alt="MedNova logo" width="40" height="40">
                    <div class="logo-text">
                        <span class="logo-title">MedNova</span>
                        <span class="logo-subtitle">Super Admin</span>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
                <a href="/admin/registrations" class="nav-item"><i class="fas fa-user-check"></i><span>Registrations</span></a>
                <a href="/admin/customers" class="nav-item"><i class="fas fa-hospital-user"></i><span>Customers</span></a>
                <a href="/admin/support" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
                <a href="/admin/profile" class="nav-item active"><i class="fas fa-user"></i><span>Profile</span></a>
            </nav>
            <div class="sidebar-footer">
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <div class="breadcrumb"><span>Admin</span><i class="fas fa-chevron-right"></i><span class="active">Profile</span></div>
                </div>
                <div class="top-bar-right">
                    <div class="topbar-avatar"><i class="fas fa-user-shield"></i></div>
                    <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>

            <div class="content-area" style="display:flex;flex-direction:column;gap:20px;max-width:760px;">
                <h1 class="page-title">My Profile</h1>

                <div class="card" style="background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:28px;">
                    <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;">
                        <div style="position:relative;">
                            <div id="profilePicWrap" style="width:84px;height:84px;border-radius:50%;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden;">
                                <span style="font-weight:700;">?</span>
                            </div>
                            <label for="picUpload" style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.75rem;" title="Change photo">
                                <i class="fas fa-camera"></i>
                            </label>
                            <input type="file" id="picUpload" accept="image/*" style="display:none;">
                            <button type="button" id="picDeleteBtn" class="avatar-delete-btn" style="display:none;" title="Remove photo">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div>
                            <div id="profileName" style="font-size:1.2rem;font-weight:800;">—</div>
                            <div id="profileRole" class="caption">—</div>
                        </div>
                    </div>

                    <div class="section-title" style="margin-bottom:14px;">Personal details</div>
                    <div class="auth-form-row">
                        <div class="form-group"><label>Full name</label><input class="form-input editable-field" id="fullName" disabled></div>
                        <div class="form-group"><label>Job title</label><input class="form-input editable-field" id="jobTitle" disabled></div>
                    </div>
                    <div class="auth-form-row">
                        <div class="form-group"><label>Phone number</label>
                            <div class="auth-phone-group">
                                <input class="form-input editable-field" id="countryCode" style="text-align:center;" disabled>
                                <input class="form-input editable-field" id="phoneNumber" disabled>
                            </div>
                        </div>
                    </div>

                    <div class="section-title" style="margin:22px 0 14px;">Account security</div>
                    <div class="auth-form-row">
                        <div class="form-group"><label>Email</label><input class="form-input" id="email" disabled></div>
                        <div class="form-group"><label>New email</label><input class="form-input" id="newEmail" placeholder="Enter new email"></div>
                    </div>
                    <div class="form-group"><label>Current password (to confirm email change)</label><input class="form-input" type="password" id="emailChangePassword" placeholder="••••••••"></div>
                    <div class="auth-alert" id="emailChangeMsg" style="margin-top:2px;display:none;"></div>
                    <button class="btn-secondary" style="margin-top:8px;" onclick="changeEmail()"><i class="fas fa-envelope"></i> Update email</button>

                    <div class="auth-form-row" style="margin-top:22px;">
                        <div class="form-group"><label>Current password</label><input class="form-input" type="password" id="currentPassword" placeholder="••••••••"></div>
                        <div class="form-group"><label>New password</label><input class="form-input" type="password" id="newPassword" placeholder="Min 8 characters"></div>
                    </div>
                    <div class="form-group"><label>Confirm new password</label><input class="form-input" type="password" id="confirmNewPassword" placeholder="Re-enter new password"></div>
                    <div class="auth-alert" id="passwordChangeMsg" style="margin-top:2px;display:none;"></div>
                    <button class="btn-secondary" style="margin-top:8px;" onclick="changePassword()"><i class="fas fa-key"></i> Update password</button>

                    <div class="auth-alert success" id="saveSuccess" style="margin-top:16px;"></div>
                    <div style="margin-top:8px;display:flex;gap:10px;">
                        <button class="btn-secondary" id="editProfileBtn" onclick="enterEditMode()"><i class="fas fa-pen"></i> Edit</button>
                        <button class="btn-primary" id="saveProfileBtn" style="display:none;" onclick="saveProfile()"><i class="fas fa-save"></i> Save changes</button>
                        <button class="btn-secondary" id="cancelEditBtn" style="display:none;" onclick="cancelEditMode()"><i class="fas fa-times"></i> Cancel</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/profile-picture.js"></script>
    <script>
        let profileData = null;

        async function loadProfile() {
            const res = await fetch('/api/profile', { credentials: 'same-origin' });
            if (res.status === 401) { window.location.href = '/login'; return; }
            profileData = await res.json();

            document.getElementById('profileName').textContent = profileData.full_name;
            document.getElementById('profileRole').textContent = 'Super Admin';

            document.getElementById('fullName').value = profileData.full_name || '';
            document.getElementById('jobTitle').value = profileData.job_title || '';
            document.getElementById('email').value = profileData.email || '';
            document.getElementById('countryCode').value = profileData.country_code || '';
            document.getElementById('phoneNumber').value = profileData.phone_number || '';

            renderProfilePicWrap('profilePicWrap', 'picDeleteBtn', profileData.full_name, profileData.profile_picture_path);
        }

        wireProfilePictureControls({
            wrapId: 'profilePicWrap',
            uploadInputId: 'picUpload',
            deleteBtnId: 'picDeleteBtn',
            getFullName: () => (profileData && profileData.full_name) || '',
            onUpdated: (newPath) => {
                if (profileData) profileData.profile_picture_path = newPath;
                if (typeof __currentUser !== 'undefined' && __currentUser) {
                    __currentUser.profile_picture_path = newPath;
                    applyCurrentUserToTopbar(__currentUser);
                }
            },
        });

        const EDITABLE_FIELD_IDS = ['fullName', 'jobTitle', 'countryCode', 'phoneNumber'];

        function enterEditMode() {
            EDITABLE_FIELD_IDS.forEach(id => document.getElementById(id).disabled = false);
            document.getElementById('editProfileBtn').style.display = 'none';
            document.getElementById('saveProfileBtn').style.display = '';
            document.getElementById('cancelEditBtn').style.display = '';
            document.getElementById('fullName').focus();
        }

        function exitEditMode() {
            EDITABLE_FIELD_IDS.forEach(id => document.getElementById(id).disabled = true);
            document.getElementById('editProfileBtn').style.display = '';
            document.getElementById('saveProfileBtn').style.display = 'none';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function cancelEditMode() {
            if (profileData) {
                document.getElementById('fullName').value = profileData.full_name || '';
                document.getElementById('jobTitle').value = profileData.job_title || '';
                document.getElementById('countryCode').value = profileData.country_code || '';
                document.getElementById('phoneNumber').value = profileData.phone_number || '';
            }
            exitEditMode();
        }

        async function saveProfile() {
            const payload = {
                full_name: document.getElementById('fullName').value.trim(),
                job_title: document.getElementById('jobTitle').value.trim(),
                country_code: document.getElementById('countryCode').value.trim(),
                phone_number: document.getElementById('phoneNumber').value.trim(),
            };
            const res = await fetch('/api/profile', {
                method: 'PUT', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            if (res.ok) {
                profileData = { ...profileData, ...payload };
                const successBox = document.getElementById('saveSuccess');
                successBox.textContent = 'Profile updated successfully.';
                successBox.style.display = 'block';
                setTimeout(() => successBox.style.display = 'none', 3000);
                exitEditMode();
                loadCurrentUser();
            } else {
                alert('Could not save profile.');
            }
        }

        function showAlert(elId, message, isSuccess) {
            const box = document.getElementById(elId);
            box.textContent = message;
            box.className = `auth-alert ${isSuccess ? 'success' : 'error'}`;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 4000);
        }

        async function changeEmail() {
            const new_email = document.getElementById('newEmail').value.trim();
            const current_password = document.getElementById('emailChangePassword').value;
            if (!new_email || !current_password) {
                showAlert('emailChangeMsg', 'Enter the new email and your current password.', false);
                return;
            }
            const res = await fetch('/api/profile/change-email', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_email, current_password }),
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('email').value = data.email;
                document.getElementById('newEmail').value = '';
                document.getElementById('emailChangePassword').value = '';
                showAlert('emailChangeMsg', 'Email updated successfully.', true);
                loadCurrentUser();
            } else {
                showAlert('emailChangeMsg', data.detail || 'Could not update email.', false);
            }
        }

        async function changePassword() {
            const current_password = document.getElementById('currentPassword').value;
            const new_password = document.getElementById('newPassword').value;
            const confirm_new_password = document.getElementById('confirmNewPassword').value;
            if (!current_password || !new_password || !confirm_new_password) {
                showAlert('passwordChangeMsg', 'Fill in all password fields.', false);
                return;
            }
            if (new_password !== confirm_new_password) {
                showAlert('passwordChangeMsg', 'New password and confirmation do not match.', false);
                return;
            }
            if (new_password.length < 8) {
                showAlert('passwordChangeMsg', 'New password must be at least 8 characters.', false);
                return;
            }
            const res = await fetch('/api/profile/change-password', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current_password, new_password }),
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
                showAlert('passwordChangeMsg', 'Password updated successfully.', true);
            } else {
                showAlert('passwordChangeMsg', data.detail || 'Could not update password.', false);
            }
        }

        loadProfile();
    </script>
</body>
</html>
